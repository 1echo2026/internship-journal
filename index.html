<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实习日志手账本</title>
<style>
/* ============================================================
   实习日志手账本 · 复古欧式手账风格
   v1.0 · 2026-09-21 · 单文件 / 零依赖 / localStorage 本地存储
   ============================================================ */
:root{
  --bg:#cba680;            /* 网页背景 浅焦糖棕 */
  --paper:#f7edcf;         /* 本子主背景 米黄羊皮纸 */
  --panel:#fff8df;         /* 面板背景 更浅米黄纸 */
  --input:#faf2da;         /* 输入框 泛黄米白纸 */
  --ink:#4b3b35;           /* 主文字 深棕墨 */
  --ink2:#927665;          /* 次要文字 灰棕 */
  --line:#ddc99e;          /* 边框线 浅棕 */
  --line2:#d8c19a;
  --btn1:#b8aad4;          /* 按钮 香芋紫渐变 */
  --btn2:#9c8cbe;
  --btn-text:#fbf3dc;
  --gold:#a67c2e;          /* 强调 金棕 */
  --early1:#d4956a; --early2:#b8784a;   /* 早班 焦糖橙 */
  --late1:#8a7ab0;  --late2:#6e5e9a;    /* 晚班 深紫 */
  --rest1:#a8b89a;  --rest2:#8a9a78;    /* 休息 橄榄绿 */
  --danger1:#f0b8c8; --danger2:#e89aaf; /* 危险 粉红 */
  --shadow:0 6px 22px rgba(74,55,34,.28);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ min-height:100%; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  background-color:var(--bg);
  /* 点状纹理 */
  background-image:radial-gradient(rgba(90,62,30,.10) 1px, transparent 1.2px);
  background-size:20px 20px;
  color:var(--ink);
  font-family:Georgia,'微软雅黑','Microsoft YaHei',sans-serif;
  font-size:15px;
  line-height:1.6;
  padding:18px 12px 30px;
  overflow-x:hidden;   /* 防止横向溢出滚动条 */
}
/* ---------- 巴洛克卷草纹 四角 ---------- */
.orn{ position:fixed; width:150px; height:150px; opacity:.32; pointer-events:none; z-index:0; }
.orn.tl{ top:-6px; left:-6px; }
.orn.tr{ top:-6px; right:-6px; transform:rotate(90deg); }
.orn.br{ bottom:-6px; right:-6px; transform:rotate(180deg); }
.orn.bl{ bottom:-6px; left:-6px; transform:rotate(270deg); }
/* 右上角 淡粉紫星星 */
.page-star{ position:fixed; top:14px; right:16px; width:34px; height:34px; opacity:.55; z-index:0; pointer-events:none; }

/* ---------- 本子主体 ---------- */
.page{
  position:relative;
  max-width:1200px;
  margin:0 auto;
  background:var(--paper);
  border:1px solid var(--line2);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:16px 20px 10px 26px;
  z-index:1;
}
/* 装订孔 */
.page::before{
  content:''; position:absolute; left:8px; top:16px; bottom:16px; width:5px;
  background-image:radial-gradient(circle, #b49a6c 2px, transparent 2.4px);
  background-size:5px 34px; background-repeat:repeat-y;
  opacity:.5;
}
/* 装订虚线 */
.page::after{
  content:''; position:absolute; left:17px; top:14px; bottom:14px; width:0;
  border-left:1.5px dashed #c8ad7d; opacity:.55;
}

/* ---------- 标题区 ---------- */
header{
  text-align:center; padding:6px 0 14px; position:relative;
}
header h1{
  font-family:'KaiTi','STKaiti','楷体',Georgia,serif;
  font-size:34px; letter-spacing:4px; color:var(--ink);
  text-shadow:1px 1px 0 rgba(255,255,255,.4);
}
header .subtitle{
  font-size:13px; color:var(--ink2); letter-spacing:2px; margin-top:2px;
}
.header-actions{
  margin-top:12px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
}

/* ---------- 按钮 ---------- */
button{
  font-family:'KaiTi','STKaiti','楷体','Microsoft YaHei',sans-serif;
  border:none; cursor:pointer; user-select:none;
  border-radius:8px;
  color:var(--btn-text);
  background:linear-gradient(180deg,var(--btn1),var(--btn2));
  padding:7px 14px; font-size:14px; letter-spacing:1px;
  box-shadow:0 3px 0 rgba(90,70,120,.45), inset 0 0 0 1.5px rgba(251,243,220,.35);
  position:relative;
  transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
}
button:hover{ transform:translateY(-1px); filter:brightness(1.08); }
button:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(90,70,120,.45), inset 0 0 0 1.5px rgba(251,243,220,.35); }
button.small{ padding:4px 10px; font-size:12px; border-radius:6px; }
button.primary{ background:linear-gradient(180deg,var(--btn1),var(--btn2)); }
button.danger{ background:linear-gradient(180deg,var(--danger1),var(--danger2)); box-shadow:0 3px 0 rgba(150,80,100,.4), inset 0 0 0 1.5px rgba(255,255,255,.3); }
button.ghost{
  background:var(--input); color:var(--ink);
  border:1px solid var(--line); box-shadow:0 2px 0 rgba(90,70,120,.12);
}
button.ghost:hover{ border-color:var(--gold); color:var(--gold); }
button.on{ filter:brightness(1.06); box-shadow:0 3px 0 rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.5); }
button:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

/* ---------- 主布局 ---------- */
main{
  display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start;
}
/* ---------- 面板通用 ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--line2);
  border-radius:10px;
  box-shadow:0 2px 8px rgba(74,55,34,.12);
  padding:12px 12px 14px;
  position:relative;
  margin-bottom:16px;
}
/* 内部金棕虚线内框 */
.panel::before{
  content:''; position:absolute; inset:5px; border:1.5px dashed var(--gold);
  border-radius:7px; opacity:.4; pointer-events:none;
}
.panel-title{
  font-family:'KaiTi','STKaiti','楷体',Georgia,serif;
  font-size:18px; letter-spacing:2px; color:var(--gold);
  margin:2px 0 10px; display:flex; align-items:center; gap:6px;
}
.panel-title::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent); margin-left:6px; }

/* ---------- 左侧操作行 ---------- */
.row-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }

/* ---------- 统计栏 ---------- */
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.stat-box{
  background:var(--input); border:1px solid var(--line); border-radius:8px;
  padding:6px 4px; text-align:center;
}
.stat-box .num{ font-size:20px; font-weight:bold; color:var(--ink); font-family:Georgia,serif; }
.stat-box .lab{ font-size:11px; color:var(--ink2); letter-spacing:1px; }
.salary-box{
  grid-column:1 / -1;
  background:linear-gradient(135deg,#e6c98f,#d9ab63);
  border:1px solid #c89a52; border-radius:8px;
  padding:8px 6px; text-align:center;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);
}
.salary-box .num{ font-size:24px; color:#5a3d12; font-family:Georgia,serif; }
.salary-box .lab{ font-size:12px; color:#6d4c16; letter-spacing:2px; }

/* ---------- 视图切换 + 搜索 ---------- */
.view-switch{ display:flex; gap:8px; margin-bottom:8px; }
.search-wrap{ position:relative; margin-bottom:10px; }
.search-wrap input{
  width:100%; padding:7px 10px 7px 30px; border:1px solid var(--line);
  border-radius:7px; background:var(--input); color:var(--ink); font-size:14px;
  font-family:inherit; outline:none; transition:border-color .15s, box-shadow .15s;
}
.search-wrap::before{
  content:'🔍'; position:absolute; left:8px; top:7px; font-size:13px; opacity:.6;
}
.search-wrap input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(166,124,46,.18); }

/* ---------- 日志列表 ---------- */
.log-list{ max-height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
.log-item{
  background:var(--input); border:1px solid var(--line); border-radius:8px;
  padding:6px 8px; cursor:pointer; position:relative;
  transition:border-color .12s, background .12s;
}
.log-item:hover{ border-color:var(--gold); }
.log-item.active{ border-color:var(--gold); background:#f1e2b8; box-shadow:0 0 0 2px rgba(166,124,46,.2); }
.log-item .li-top{ display:flex; align-items:center; gap:6px; font-size:13px; }
.log-item .li-date{ font-weight:bold; color:var(--ink); }
.log-item .li-sticker{ width:18px; height:18px; object-fit:contain; flex:0 0 auto; }
.log-item .li-shift{ font-size:11px; color:var(--btn-text); border-radius:4px; padding:0 5px; }
.log-item .li-hours{ font-size:11px; color:var(--ink2); margin-left:auto; }
.log-item .li-snippet{
  font-size:12px; color:var(--ink2); margin-top:2px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; padding-right:26px;
}
.log-item .li-del{
  position:absolute; right:5px; bottom:4px; background:transparent; border:none;
  color:var(--ink2); font-size:13px; padding:2px 4px; cursor:pointer;
  box-shadow:none; border-radius:4px;
}
.log-item .li-del:hover{ color:var(--danger2); filter:none; transform:none; }
.empty-tip{ text-align:center; color:var(--ink2); font-size:13px; padding:18px 0; letter-spacing:1px; }
.empty-tip::before{ content:'✦ '; color:var(--gold); }

/* ---------- 月历 ---------- */
.cal-head{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:8px; }
.cal-title{ font-family:'KaiTi','STKaiti','楷体',Georgia,serif; font-size:17px; color:var(--gold); min-width:110px; text-align:center; }
.cal-week{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:5px; max-width:620px; margin-left:auto; margin-right:auto; }
.cal-week div{ text-align:center; font-size:12px; color:var(--ink2); }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; max-width:620px; margin:0 auto; }
.cal-cell{
  height:82px; background:var(--input); border:1px solid var(--line);
  border-radius:7px; position:relative; padding:4px; cursor:pointer;
  transition:border-color .12s, background .12s;
}
.cal-cell:hover{ border-color:var(--gold); }
.cal-cell.has-log{ border-color:var(--gold); background:#f3e5bd; }
.cal-cell.selected{ background:#ead9ad; box-shadow:0 0 0 2px rgba(166,124,46,.3); }
.cal-cell.today{ border:2px solid var(--gold); }
.cal-cell.empty{ background:transparent; border-color:transparent; cursor:default; }
.cal-num{ position:absolute; top:3px; left:6px; font-size:12px; color:var(--ink); }
.cal-num.holiday{ color:#c05a5a; }
.cal-sticker{ position:absolute; inset:0; margin:auto; width:72%; height:72%; object-fit:contain; pointer-events:none; }
.cal-stamp{
  position:absolute; top:2px; right:4px;
  font-family:'KaiTi','STKaiti','楷体',serif; font-size:12px;
  width:18px; height:18px; line-height:18px; text-align:center;
  border-radius:3px; transform:rotate(-10deg); opacity:.5; color:#fff;
}
.cal-stamp.early{ background:var(--early2); }
.cal-stamp.late{ background:var(--late2); }
.cal-stamp.rest{ background:var(--rest2); }

/* ---------- 当日待办 ---------- */
.todo-add{ display:flex; gap:8px; margin-bottom:8px; }
.todo-add input{
  flex:1; padding:6px 9px; border:1px solid var(--line); border-radius:7px;
  background:var(--input); color:var(--ink); font-size:13px; font-family:inherit; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.todo-add input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(166,124,46,.18); }
.todo-list{ display:flex; flex-direction:column; gap:5px; max-height:180px; overflow-y:auto; }
.todo-item{ display:flex; align-items:center; gap:8px; background:var(--input); border:1px solid var(--line); border-radius:7px; padding:4px 8px; font-size:13px; }
.todo-item input[type=checkbox]{ accent-color:var(--gold); width:15px; height:15px; cursor:pointer; }
.todo-item .t-text{ flex:1; word-break:break-all; }
.todo-item.done .t-text{ text-decoration:line-through; color:var(--ink2); }
.todo-item .t-del{ background:none; border:none; color:var(--ink2); cursor:pointer; font-size:13px; box-shadow:none; padding:0 3px; }
.todo-item .t-del:hover{ color:var(--danger2); filter:none; transform:none; }

/* ---------- 右侧编辑面板 ---------- */
.editor-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.save-state{ font-size:13px; color:var(--ink2); letter-spacing:1px; margin-right:auto; }
.save-state.saving{ color:var(--gold); }
.save-state.saved::before{ content:'● '; color:#7aa06a; }
.editor-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.field{ display:flex; flex-direction:column; gap:3px; }
.field label{ font-size:12px; color:var(--ink2); letter-spacing:1px; }
.editor-meta input[type=date], .editor-meta input[type=number]{
  padding:6px 9px; border:1px solid var(--line); border-radius:7px; background:var(--input);
  color:var(--ink); font-size:14px; font-family:inherit; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.editor-meta input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(166,124,46,.18); }

/* 班次按钮 */
.shift-btns{ display:flex; gap:8px; }
.shift-btn{
  padding:6px 16px; font-size:13px; border-radius:7px; border:none; cursor:pointer;
  color:var(--btn-text); opacity:.55; letter-spacing:1px;
  transition:transform .12s, opacity .12s, filter .12s;
}
.shift-btn:hover{ opacity:.85; }
.shift-btn.on{ opacity:1; box-shadow:0 3px 0 rgba(0,0,0,.2); }
.shift-btn.early{ background:linear-gradient(180deg,var(--early1),var(--early2)); }
.shift-btn.late{ background:linear-gradient(180deg,var(--late1),var(--late2)); }
.shift-btn.rest{ background:linear-gradient(180deg,var(--rest1),var(--rest2)); }

/* 文本域 */
.edit-block{ margin-bottom:14px; }
.edit-block .eb-label{
  display:flex; align-items:center; gap:4px; font-family:'KaiTi','STKaiti','楷体',Georgia,serif;
  font-size:15px; letter-spacing:1px; color:var(--gold); margin-bottom:4px;
}
.eb-label .req{ color:var(--danger2); font-size:12px; }
textarea{
  width:100%; min-height:76px; resize:vertical; padding:9px 11px;
  border:1px solid var(--line); border-radius:7px; background:var(--input);
  color:var(--ink); font-size:14px; line-height:1.7; font-family:inherit; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
textarea:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(166,124,46,.18); }
textarea#inWork{ min-height:110px; }
/* 字体切换类 */
.font-kaiti{ font-family:'KaiTi','STKaiti','楷体',serif; }
.font-song{ font-family:'SimSun','Songti SC','宋体',serif; }
.font-hand{ font-family:'KaiTi','STKaiti','楷体',cursive,'Segoe Script',cursive; }

/* 字体切换行 */
.font-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.font-row .fr-lab{ font-size:13px; color:var(--ink2); letter-spacing:1px; }
.font-row button{ font-size:12px; padding:4px 10px; }
.font-row button.on{ box-shadow:0 3px 0 rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.5); filter:brightness(1.06); }

/* 心情贴图 */
.sticker-row{ display:flex; gap:8px; overflow-x:auto; padding:6px 2px 8px; margin-bottom:14px; }
.sticker-chip{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 8px; border:1.5px solid var(--line); background:var(--input);
  border-radius:10px; cursor:pointer; font-size:22px;
  transition:border-color .12s, background .12s, transform .12s;
}
.sticker-chip img{ width:38px; height:38px; object-fit:contain; display:block; }
.sticker-chip .n{ font-size:11px; color:var(--ink2); white-space:nowrap; }
.sticker-chip:hover{ border-color:var(--gold); }
.sticker-chip.sel{ border-color:var(--gold); background:#f1e2b8; box-shadow:0 0 0 2px rgba(166,124,46,.25); transform:translateY(-2px); }

/* 编辑区底部按钮 */
.editor-foot{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }

/* ---------- 溢出防护：允许收缩（防止窄屏被撑宽超出背景） ---------- */
main > *, aside > section, .log-item, .todo-item, .sticker-row,
.row-actions, .view-switch, .editor-meta, .editor-head, .font-row,
.editor-foot, .shift-btns{ min-width:0; }
.panel{ min-width:0; }

/* ---------- 页脚 ---------- */
footer{ text-align:center; padding:14px 0 4px; color:var(--ink2); font-size:12px; letter-spacing:2px; }
.footer-orn{ display:block; margin:0 auto 6px; width:300px; opacity:.7; }

/* ---------- 弹窗 ---------- */
.modal-mask{
  position:fixed; inset:0; background:rgba(60,42,20,.45); z-index:100;
  display:none; align-items:center; justify-content:center; padding:16px;
}
.modal-mask.show{ display:flex; animation:fadeIn .2s ease; }
.modal{
  background:var(--paper); border:1px solid var(--line2); border-radius:12px;
  box-shadow:var(--shadow); max-width:520px; width:100%; max-height:86vh;
  overflow-y:auto; padding:20px 22px; position:relative;
  animation:popIn .28s cubic-bezier(.34,1.4,.64,1);
}
.modal .m-star{ position:absolute; width:16px; height:16px; opacity:.4; }
.modal .m-star.s1{ top:8px; left:10px; } .modal .m-star.s2{ top:8px; right:10px; }
.modal .m-star.s3{ bottom:8px; left:10px; } .modal .m-star.s4{ bottom:8px; right:10px; }
.modal-title{
  font-family:'KaiTi','STKaiti','楷体',Georgia,serif; font-size:20px; letter-spacing:2px;
  color:var(--gold); text-align:center; margin-bottom:14px;
}
.modal-body{ font-size:14px; color:var(--ink); }
.modal-btns{ display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes popIn{ 0%{opacity:0; transform:scale(.86);} 100%{opacity:1; transform:scale(1);} }

/* 弹窗内表单 */
.modal-body label.mf{ display:block; font-size:13px; color:var(--ink2); margin:8px 0 3px; letter-spacing:1px; }
.modal-body input[type=text], .modal-body input[type=password], .modal-body textarea, .modal-body select{
  width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:7px;
  background:var(--input); color:var(--ink); font-size:14px; font-family:inherit; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.modal-body input:focus, .modal-body textarea:focus, .modal-body select:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(166,124,46,.18); }
.m-hint{ font-size:12px; color:var(--ink2); margin-top:6px; line-height:1.7; }

/* 目录面板 */
.idx-list{ display:flex; flex-direction:column; gap:6px; max-height:340px; overflow-y:auto; }
.idx-item{
  display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--input);
  border:1px solid var(--line); border-radius:7px; cursor:pointer; font-size:13px;
}
.idx-item:hover{ border-color:var(--gold); }
.idx-item .idx-date{ font-weight:bold; }
.idx-item .idx-sticker{ width:18px; height:18px; object-fit:contain; flex:0 0 auto; }
.idx-item .idx-snippet{ color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }

/* 排班面板 */
.sched-nav{ display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
.sched-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:14px; }
.sched-day{
  background:var(--input); border:1px solid var(--line); border-radius:8px; padding:8px 6px;
  text-align:center; display:flex; flex-direction:column; gap:6px; align-items:stretch;
}
.sched-day.today{ border:2px solid var(--gold); }
.sched-date{ font-size:12px; color:var(--ink); margin-bottom:2px; }
.sched-date .today-tag{ color:var(--gold); font-weight:bold; }
.sched-btn{
  padding:5px 0; font-size:12px; border-radius:6px; border:none; cursor:pointer;
  color:var(--btn-text); opacity:.5; letter-spacing:1px;
}
.sched-btn:hover{ opacity:.85; }
.sched-btn.on{ opacity:1; box-shadow:0 2px 0 rgba(0,0,0,.2); }
.sched-btn.early{ background:linear-gradient(180deg,var(--early1),var(--early2)); }
.sched-btn.late{ background:linear-gradient(180deg,var(--late1),var(--late2)); }
.sched-btn.rest{ background:linear-gradient(180deg,var(--rest1),var(--rest2)); }
.sched-import{ border-top:1px dashed var(--line); padding-top:12px; display:flex; flex-direction:column; gap:8px; }
.sched-import .si-btns{ display:flex; gap:8px; flex-wrap:wrap; }

/* Toast */
.toast{
  position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-140%);
  background:var(--paper); border:1.5px solid var(--gold); border-radius:10px;
  box-shadow:var(--shadow); padding:12px 22px; z-index:200; text-align:center;
  transition:transform .35s cubic-bezier(.34,1.4,.64,1); max-width:88%;
  opacity:0; pointer-events:none;
}
.toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
.toast .t-main{ font-family:'KaiTi','STKaiti','楷体',Georgia,serif; font-size:16px; color:var(--ink); letter-spacing:1px; }
.toast .t-sub{ font-size:12px; color:var(--ink2); margin-top:2px; }

/* ---------- 响应式 ---------- */
@media (max-width:960px){
  main{ grid-template-columns:1fr; }
  .orn{ width:100px; height:100px; }
  /* 平板/手机：编辑区提到最前，打开就能写 */
  .editor{ order:-1; }
}
@media (max-width:560px){
  body{ padding:10px 6px 20px; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  .page{ padding:12px 12px 8px 18px; }
  header h1{ font-size:26px; }

  /* 触摸目标加大，手指好点 */
  button{ min-height:44px; padding:10px 16px; font-size:15px; }
  button.small{ min-height:38px; padding:8px 13px; font-size:14px; }
  .font-row button{ min-height:38px; font-size:13px; }
  .sched-btn{ min-height:38px; font-size:13px; }

  /* 输入框 ≥16px，避免 iOS 聚焦时自动放大页面 */
  input, textarea, select{ font-size:16px !important; }

  /* 输入区更宽裕，写长内容更舒服 */
  textarea{ min-height:104px; }
  textarea#inWork{ min-height:150px; }
  .edit-block{ margin-bottom:16px; }

  /* 编辑操作栏随滚动吸附，随时能保存 */
  .editor-head{ position:sticky; top:0; z-index:6; background:var(--panel);
    padding:8px 0 10px; margin:-4px 0 6px; flex-wrap:wrap; }
  .editor-head .save-state{ margin-right:0; flex:0 0 auto; }
  .editor-head button{ flex:1 1 0; min-width:0; padding:8px 6px; }
  .editor-foot{ position:sticky; bottom:0; z-index:6; background:var(--panel);
    padding:10px 0 calc(6px + env(safe-area-inset-bottom)); margin-top:10px; }
  .editor-foot button{ flex:1; }

  .cal-cell{ height:60px; }
  .cal-sticker{ width:66%; height:66%; }
  .editor-meta .field:last-child{ flex:1 1 100%; }
  .shift-btns{ flex-direction:row; width:100%; }
  .shift-btn{ flex:1; padding:10px 0; }
  .sched-grid{ grid-template-columns:repeat(2,1fr); }
  .stats{ gap:5px; }
  .sticker-chip{ padding:8px 10px; }
  .sticker-chip img{ width:44px; height:44px; }
}
</style>

<script>
/* ============================================================
   实习日志手账本 · 逻辑脚本

'use strict';
const $ = id => document.getElementById(id);

/* ---------- 常量与数据键 ---------- */
const LS_LOGS   = 'internship-logs-v1';
const LS_SHIFTS = 'intern-shifts-v1';

const SHIFT_COLORS = {早:'early', 晚:'late', 休:'rest'};

/* 17 个心情贴图（原神风表情包，存放于 assets/stickers） */
const STICKER_BASE = 'assets/stickers/';
const STICKERS = [
  {name:'拜托拜托', img:'baituo.png'},   {name:'抱大腿', img:'baodatui.png'},
  {name:'吃惊', img:'chijing.png'},      {name:'呆呆', img:'daidai.png'},
  {name:'肚子好饿', img:'duzi.png'},     {name:'干饭时间', img:'ganfan.png'},
  {name:'干劲满满', img:'ganjin.png'},   {name:'开心团建', img:'kaixin.png'},
  {name:'囊中羞涩', img:'nangzhong.png'},{name:'平平淡淡', img:'pingdan.png'},
  {name:'轻松完成', img:'qingsong.png'}, {name:'身体被掏空', img:'shenti.png'},
  {name:'收货满满', img:'shouhuo.png'},  {name:'想骂人', img:'xiangma.png'},

const WEEK_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];

/* 预置排班（8.31 – 11.01，2026 年）：标准班=早，晚班=晚，休息=休 */
const DEFAULT_SHIFTS = {
  '2026-08-31':'早','2026-09-01':'早','2026-09-02':'早','2026-09-03':'早',
  '2026-09-04':'休','2026-09-05':'休',
  '2026-09-06':'晚','2026-09-07':'早','2026-09-08':'早','2026-09-09':'早',
  '2026-09-10':'晚','2026-09-11':'休','2026-09-12':'休',
  '2026-09-13':'晚','2026-09-14':'早','2026-09-15':'早',
  '2026-09-16':'晚','2026-09-17':'晚','2026-09-18':'休','2026-09-19':'休',
  '2026-09-20':'晚','2026-09-21':'晚','2026-09-22':'晚','2026-09-23':'晚',
  '2026-09-24':'晚','2026-09-25':'休',
  '2026-09-26':'晚','2026-09-27':'晚','2026-09-28':'早',
  '2026-09-29':'休','2026-09-30':'休',
  '2026-10-01':'晚','2026-10-02':'晚','2026-10-03':'晚','2026-10-04':'晚',
  '2026-10-05':'休','2026-10-06':'休','2026-10-07':'休','2026-10-08':'休',
  '2026-10-09':'晚','2026-10-10':'晚','2026-10-11':'休',
  '2026-10-12':'早','2026-10-13':'早','2026-10-14':'早','2026-10-15':'早',
  '2026-10-16':'休','2026-10-17':'休',
  '2026-10-18':'晚','2026-10-19':'晚','2026-10-20':'晚','2026-10-21':'晚',
  '2026-10-22':'晚','2026-10-23':'休','2026-10-24':'休',
  '2026-10-25':'晚',
  '2026-10-26':'早','2026-10-27':'早','2026-10-28':'早','2026-10-29':'早',
  '2026-10-30':'休','2026-10-31':'休',
  '2026-11-01':'晚'
};

/* ---------- 状态 ---------- */
let logs = loadJSON(LS_LOGS, []);
let shifts = loadJSON(LS_SHIFTS, {});
/* 首次加载时，把预置排班写入（不覆盖已有数据，仅补全缺失日期） */
const defaultCount = Object.keys(DEFAULT_SHIFTS).filter(k => !shifts[k]).length;
if(defaultCount){
  Object.assign(shifts, DEFAULT_SHIFTS);
  saveJSON(LS_SHIFTS, shifts);
}
let currentDate = todayStr();
let selectedShift = null;   // '早' | '晚' | '休' | null
let selectedSticker = null;
let fontPref = localStorage.getItem(LS_FONT) || 'default';
let dirty = false;
let saveTimer = null;
let currentView = 'list';
let calYear = 0, calMonth = 0;      // 月历当前年月
let schedOffset = 0;                // 排班表周偏移
let calSelected = null;

/* ---------- 基础工具 ---------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseDate(s){
  const p = s.split('-').map(Number);
  return new Date(p[0], p[1]-1, p[2]);
}
function addDays(date, n){
  const d = new Date(date); d.setDate(d.getDate()+n); return d;
}
function loadJSON(k, def){
  try{ const v = JSON.parse(localStorage.getItem(k)); return (v === null || v === undefined) ? def : v; }
  catch(e){ return def; }
}
function saveJSON(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getLog(date){ return logs.find(l => l.date === date); }
/* 有正文的日志（列表/统计/导航只用这些） */
function contentLogs(){ return logs.filter(l => (l.work||'').trim() !== ''); }

/* ---------- 弹窗系统（复古风格，禁用原生 alert/confirm） ---------- */
function openModal(title, bodyHTML, buttons){
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHTML;
  const btns = $('modalBtns'); btns.innerHTML = '';
  (buttons || []).forEach(b => {
    const el = document.createElement('button');
    el.className = (b.cls || 'ghost') + (b.small ? ' small' : '');
    el.textContent = b.label;
    el.onclick = () => { if(b.onClick) b.onClick(); };
    btns.appendChild(el);
  });
  $('modalMask').classList.add('show');
}
function closeModal(){ $('modalMask').classList.remove('show'); }
function confirmDialog(msg, onYes, okText){
  openModal('请确认', '<p style="text-align:center;padding:6px 0;">'+msg+'</p>', [
    {label:'取消', cls:'ghost', onClick:closeModal},
    {label: okText || '确认', cls:'danger', onClick:()=>{ closeModal(); onYes(); }}
  ]);
}
function toast(main, sub){
  $('toastMain').textContent = main;
  $('toastSub').textContent = sub || '';
  const t = $('toast'); t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2600);
}
$('modalMask').addEventListener('click', e => { if(e.target === $('modalMask')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* ---------- 编辑区：加载 / 读取 ---------- */
const ED_FIELDS = ['work','learning','problems','plan'];
function loadEditor(date){
  // 若有未保存变更先落盘
  if(dirty) saveNow(false);
  currentDate = date;
  const log = getLog(date);
  $('inDate').value = date;
  $('inHours').value = log && log.hours ? log.hours : '';
  $('inWork').value   = log ? log.work    : '';
  $('inLearning').value = log ? log.learning : '';
  $('inProblems').value = log ? log.problems : '';
  $('inPlan').value   = log ? log.plan    : '';
  selectedShift = (log && log.shift) || shifts[date] || null;
  selectedSticker = log ? log.sticker : null;
  updateShiftUI(); updateStickerUI(); renderTodos(date);
  setSaveState('saved');
  dirty = false;
  calSelected = date;
  renderCalendar();
}
function readEditor(){
  const d = $('inDate').value;
  if(!d) return null;
  const old = getLog(d);
  // 班次：选中的写入 shifts，未选则移除（未选 = 默认休息，不出印章）
  if(selectedShift) shifts[d] = selectedShift; else delete shifts[d];
  return {
    date: d,
    hours: parseFloat($('inHours').value) || 0,
    work: $('inWork').value,
    learning: $('inLearning').value,
    problems: $('inProblems').value,
    plan: $('inPlan').value,
    sticker: selectedSticker,
    shift: selectedShift,
    todos: old ? old.todos : []
  };
}
function upsertLog(log){
  const i = logs.findIndex(l => l.date === log.date);
  if(i >= 0) logs[i] = log; else logs.push(log);
}
function setSaveState(s){
  const el = $('saveState');
  if(s === 'saving'){ el.textContent = '编辑中…'; el.className = 'save-state saving'; }
  else { el.textContent = '已保存'; el.className = 'save-state saved'; }
}

/* ---------- 保存 ---------- */
function onEditorInput(){
  dirty = true; setSaveState('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> saveNow(false), 1200);   // 延迟 1.2s 自动保存
}
function saveNow(showToast){
  clearTimeout(saveTimer);
  const log = readEditor();
  if(!log){ return; }
  if(!log.work.trim()){ dirty = false; setSaveState('saved'); return; } // 空正文不生成日志
  upsertLog(log);
  saveJSON(LS_LOGS, logs); saveJSON(LS_SHIFTS, shifts);
  dirty = false; setSaveState('saved');
  renderAll();
  if(showToast) toast('保存成功', '今天也是收获满满的一天呢~');
}

function renderCalendarInner(grid){
  $('calTitle').textContent = calYear + '年' + (calMonth+1) + '月';

  const first = new Date(calYear, calMonth, 1);
  const offset = (first.getDay() + 6) % 7;             // 周一开头
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const logMap = {};
  contentLogs().forEach(l => logMap[l.date] = l);
  let html = '';
  for(let i=0; i<offset; i++) html += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds = fmtDate(new Date(calYear, calMonth, d));

    if(ds === today) cls.push('today');
    if(l) cls.push('has-log');
    if(ds === calSelected) cls.push('selected');
    const wd = (offset + d - 1) % 7;                    // 0=周一..6=周日
    const numCls = (wd === 5 || wd === 6) ? 'cal-num holiday' : 'cal-num';
    const stamp = shifts[ds] && SHIFT_COLORS[shifts[ds]]
      ? `<span class="cal-stamp ${SHIFT_COLORS[shifts[ds]]}">${shifts[ds]}</span>` : '';

/* ---------- 每周排班表 ---------- */
function mondayOf(offset){
  const now = new Date(); now.setHours(0,0,0,0);
  const day = (now.getDay()+6)%7;           // 周一=0
  return addDays(now, -day + offset*7);
}
function openSchedule(){

}
function renderSchedule(){
  const mon = mondayOf(schedOffset);
  const today = todayStr();
  let html = `<div class="sched-nav">
      <button class="small ghost" onclick="shiftWeek(-1)">‹ 上一周</button>
      <button class="small ghost" onclick="shiftWeek(0)">本周</button>
      <button class="small ghost" onclick="shiftWeek(1)">下一周 ›</button>
    </div><div class="sched-grid">`;
  for(let i=0; i<7; i++){
    const d = addDays(mon, i); const ds = fmtDate(d);
    const cur = shifts[ds] || '';
    const isToday = ds === today;
    html += `<div class="sched-day ${isToday?'today':''}">
      <div class="sched-date">${WEEK_NAMES[i]} ${d.getMonth()+1}/${d.getDate()} ${isToday?'<span class="today-tag">·今天</span>':''}</div>
      ${['早','晚','休'].map(s =>
        `<button class="sched-btn ${s==='早'?'early':s==='晚'?'late':'rest'} ${cur===s?'on':''}"
                 onclick="toggleShift('${ds}','${s}')">${s}班</button>`).join('')}
    </div>`;
  }
  html += `</div><div class="sched-import">
      <div class="si-btns">
        <button class="small primary" id="btnPreset">导入预置排班</button>
      </div>
      <textarea id="presetText" rows="5" placeholder="粘贴排班，每行一条，支持：&#10;8/31 周日｜标准班&#10;9/06 周六｜晚班&#10;9/04 周四｜休息&#10;或：周一 早 / 2026-09-25 休"></textarea>
      <div class="si-btns"><button class="small primary" onclick="importPreset()">应用自定义排班</button></div>
    </div>`;
  $('modalBody').innerHTML = html;
  $('btnPreset').onclick = applyPreset;
}

  else shifts[ds] = s;

  renderSchedule(); renderAll();
}
/* 解析排班文本，支持：
   - "周一 早" / "星期一 晚"（当周）
   - "2026-09-25 休" / "9/25 休"
   - "8/31 周日｜标准班" / "9/01 周一|晚班" / "9/04 周四｜休息" */
function parseScheduleText(text){
  const mon = mondayOf(schedOffset);
  const year = new Date().getFullYear();
  const map = {};
  const shiftOf = s => {
    if(['早','晚','休'].includes(s)) return s;
    if(s === '标准班' || s === '早班') return '早';
    if(s === '晚班') return '晚';
    if(s === '休息' || s === '休班') return '休';
    return null;
  };
  text.split(/\r?\n/).forEach(line => {
    line = line.trim(); if(!line) return;
    const parts = line.split(/[\s,，、:：|｜]+/).filter(Boolean);
    if(parts.length < 2) return;
    const [dayKey, shift] = [parts[0], parts[parts.length - 1]];
    const s = shiftOf(shift); if(!s) return;
    let date = null;
    if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(dayKey)) date = dayKey;
    else if(/^\d{1,2}\/\d{1,2}$/.test(dayKey)){
      const [m, d] = dayKey.split('/').map(Number);
      date = year + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    } else if(/^周[一二三四五六日天]$/.test(dayKey)){
      const idx = '一二三四五六日天'.indexOf(dayKey[1]);
      const dayOfWeek = idx === 6 ? 6 : idx;
      date = fmtDate(addDays(mon, dayOfWeek));
    } else if(/^星期[一二三四五六日天]$/.test(dayKey)){
      const idx = '一二三四五六日天'.indexOf(dayKey[2]);
      const dayOfWeek = idx === 6 ? 6 : idx;
      date = fmtDate(addDays(mon, dayOfWeek));
    }
    if(date) map[date] = s;
  });
  return map;
}
function applyPreset(){
  const text = $('presetText') ? $('presetText').value.trim() : '';
  let map;
  if(text){
    map = parseScheduleText(text);
  } else {
    // 内置预置排班（一一继任示例：周一至周日）
    const mon = mondayOf(schedOffset);
    const preset = ['早','早','晚','休','晚','休','休'];
    map = {};
    for(let i=0;i<7;i++) map[fmtDate(addDays(mon,i))] = preset[i];
  }
  Object.assign(shifts, map);
  saveJSON(LS_SHIFTS, shifts);
  const n = Object.keys(map).length;
  renderSchedule(); renderAll();
  const btn = $('btnPreset');
  btn.textContent = '✅ 已导入 ' + n + ' 天排班';
  setTimeout(()=>{ if(btn) btn.textContent = '导入预置排班'; }, 2500);
}
function importPreset(){
  const text = $('presetText') ? $('presetText').value.trim() : '';
  if(!text){ toast('请先粘贴排班内容'); return; }
  const map = parseScheduleText(text);
  const n = Object.keys(map).length;
  if(!n){ toast('没有识别到有效排班，格式如：周一 早'); return; }
  Object.assign(shifts, map);
  saveJSON(LS_SHIFTS, shifts);
  renderSchedule(); renderAll();
  toast('已导入 ' + n + ' 天排班');
}

/* ---------- TXT 导入 ---------- */
function openFileImport(){ $('fileImport').click(); }
function handleImport(file){
  const reader = new FileReader();
  reader.onload = () => {
    const map = parseTxt(String(reader.result));
    if(!map.work && !map.learning && !map.problems && !map.plan){
      toast('未识别到有效内容，请确认是导出的 TXT 格式'); return;
    }
    if(map.date) $('inDate').value = map.date;
    $('inHours').value = map.hours != null ? map.hours : $('inHours').value;
    $('inWork').value = map.work || '';
    $('inLearning').value = map.learning || '';
    $('inProblems').value = map.problems || '';
    $('inPlan').value = map.plan || '';
    if(map.sticker && STICKERS.find(s=>s.name===map.sticker)){ selectedSticker = map.sticker; updateStickerUI(); }
    if(map.shift){ selectedShift = map.shift; updateShiftUI(); }
    dirty = true; setSaveState('saving');
    clearTimeout(saveTimer); saveTimer = setTimeout(()=> saveNow(false), 1200);
    toast('导入成功', '请检查内容后保存');
  };
  reader.readAsText(file, 'utf-8');
}
/* 解析导出的 TXT 格式（字段顺序状态机） */
function parseTxt(text){
  const res = {};
  const lines = text.split(/\r?\n/);
  const FIELD_HEAD = /^(心情|班次|工时|今日工作内容|复盘与心得|遇到的问题|明日计划|日期)[：:](.*)$/;
  let cur = null, buf = [];
  const flush = () => { if(cur){ res[cur] = buf.join('\n').trim(); buf = []; } };
  lines.forEach(line => {
    if(/^={3,}/.test(line.trim())){ flush(); cur = null; return; }
    const m = line.match(FIELD_HEAD);
    if(m){
      flush();
      const k = m[1], v = m[2].trim();
      if(k === '心情') res.sticker = v === '无' ? null : v;
      else if(k === '班次'){ const s = v.replace('班',''); res.shift = ['早','晚','休'].includes(s) ? s : null; }
      else if(k === '工时'){ const h = parseFloat(v); res.hours = isNaN(h) ? 0 : h; }
      else if(k === '日期') res.date = v;
      else { cur = {今日工作内容:'work', 复盘与心得:'learning', 遇到的问题:'problems', 明日计划:'plan'}[k]; if(v) buf.push(v); }
    } else if(cur){ buf.push(line); }
  });
  flush();
  return res;
}

/* ---------- GitHub Gist 云同步 ---------- */
function openSync(){
  const token = localStorage.getItem(LS_TOKEN) || '';
  const gid = localStorage.getItem(LS_GID) || '';
  const html = `
    <label class="mf">GitHub Token（需勾选 gist 权限）</label>
    <input type="password" id="inToken" value="${esc(token)}" placeholder="ghp_xxxxxxxxxxxx">
    <label class="mf">Gist ID（首次上传留空，自动创建）</label>
    <input type="text" id="inGid" value="${esc(gid)}" placeholder="留空则自动创建">
    <p class="m-hint">Token 与 Gist ID 仅保存在你的浏览器本地。电脑和平板填写相同的 Token 与 Gist ID 即可多设备同步。</p>
    <div class="modal-btns" style="margin-top:12px;">
      <button class="primary" onclick="gistUpload()">☁ 上传到云端</button>
      <button class="ghost" onclick="gistDownload()">↓ 从云端下载</button>
    </div>`;
  openModal('☁ 云同步（GitHub Gist）', html, [{label:'关闭', cls:'ghost', onClick:closeModal}]);
}
function syncCreds(){
  const t = ($('inToken') ? $('inToken').value : '').trim();
  const g = ($('inGid') ? $('inGid').value : '').trim();
  if(t) localStorage.setItem(LS_TOKEN, t); else localStorage.removeItem(LS_TOKEN);
  if(g) localStorage.setItem(LS_GID, g); else localStorage.removeItem(LS_GID);
  return {token:t, gid:g};
}
function syncPayload(){
  return {version:1, updatedAt:new Date().toISOString(), data:{
    [LS_LOGS]: logs, [LS_SHIFTS]: shifts, [LS_FONT]: fontPref
  }};
}
async function gistUpload(){
  const {token, gid} = syncCreds();
  if(!token){ toast('请填写 GitHub Token'); return; }
  const body = {
    description: '实习日志手账本备份',
    public: false,
    files: { 'internship-journal.json': { content: JSON.stringify(syncPayload()) } }
  };
  try{
    const url = gid ? 'https://api.github.com/gists/' + gid : 'https://api.github.com/gists';
    const method = gid ? 'PATCH' : 'POST';
    const r = await fetch(url, {
      method,
      headers: {Authorization:'token '+token, 'Content-Type':'application/json', 'Accept':'application/vnd.github+json'},
      body: JSON.stringify(body)
    });
    if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.message || ('HTTP '+r.status)); }
    const j = await r.json();
    localStorage.setItem(LS_GID, j.id);
    if($('inGid')) $('inGid').value = j.id;
    toast('上传成功', 'Gist ID: ' + j.id);
  }catch(err){
    openModal('上传失败', '<p style="text-align:center;color:var(--danger2);">'+esc(err.message)+'</p><p class="m-hint" style="text-align:center;">请检查 Token 是否有效、是否勾选 gist 权限，以及网络是否可访问 github.com。</p>', [{label:'好的', cls:'primary', onClick:closeModal}]);
  }
}
async function gistDownload(){
  const {token, gid} = syncCreds();
  if(!gid){ toast('请先填写 Gist ID'); return; }
  try{
    const headers = {};
    if(token) headers.Authorization = 'token ' + token;
    const r = await fetch('https://api.github.com/gists/' + gid, {headers});
    if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.message || ('HTTP '+r.status)); }
    const j = await r.json();
    const file = j.files['internship-journal.json'];
    if(!file){ throw new Error('该 Gist 中没有 internship-journal.json'); }
    const payload = JSON.parse(file.content);
    const data = payload.data || {};
    if(data[LS_LOGS]){ logs = data[LS_LOGS]; saveJSON(LS_LOGS, logs); }
    if(data[LS_SHIFTS]){ shifts = data[LS_SHIFTS]; saveJSON(LS_SHIFTS, shifts); }
    if(data[LS_FONT]){ applyFont(data[LS_FONT]); }
    loadEditor(todayStr()); renderAll();
    toast('下载成功', '云端数据已同步到本地');
  }catch(err){
    openModal('下载失败', '<p style="text-align:center;color:var(--danger2);">'+esc(err.message)+'</p><p class="m-hint" style="text-align:center;">请检查 Gist ID 是否正确、网络是否可访问 github.com。</p>', [{label:'好的', cls:'primary', onClick:closeModal}]);
  }
}

/* ---------- 统一刷新 ---------- */
function renderAll(){
  renderStats(); renderList(); renderCalendar(); renderTodos(currentDate);
}

/* ---------- 事件绑定 ---------- */
function bindEvents(){
  $('btnNew').onclick = () => { if(dirty) saveNow(false); loadEditor(todayStr()); renderList(); };
  $('btnClear').onclick = clearContent;
  $('btnSave').onclick = saveClick;
  $('btnDelete').onclick = deleteLog;
  $('inDate').onchange = onDateChange;
  $('inHours').oninput = onEditorInput;
  ED_FIELDS.forEach(f => $(f === 'work' ? 'inWork' : 'in'+f.charAt(0).toUpperCase()+f.slice(1)).addEventListener('input', onEditorInput));
  $('btnExport').onclick = exportLogs;
  $('btnSync').onclick = openSync;
  $('btnSchedule').onclick = openSchedule;
  $('btnImportTxt').onclick = openFileImport;
  $('fileImport').onchange = e => { if(e.target.files[0]) handleImport(e.target.files[0]); e.target.value=''; };
  $('searchInput').oninput = renderList;
  $('btnListView').onclick = () => switchView('list');
  $('btnCalView').onclick = () => switchView('calendar');
  $('calPrev').onclick = calPrev;
  $('calNext').onclick = calNext;
  $('calToday').onclick = calGoToday;
  $('btnAddTodo').onclick = addTodo;
  $('todoInput').onkeydown = e => { if(e.key === 'Enter') addTodo(); };
  $('btnIndex').onclick = openIndex;
  $('btnPrev').onclick = prevLog;
  $('btnNext').onclick = nextLog;
  // 关闭/刷新/跳转时自动保存
  window.addEventListener('beforeunload', () => {
    if(dirty){
      saveNow(false);
      localStorage.setItem('pending-unload-save', '1');
    }
  });
}

/* ---------- 初始化 ---------- */
function init(){
  applyFont(fontPref);
  initCal();
  renderStickers();
  // 上次关闭时若有未保存内容被自动保存，进入时提示
  if(localStorage.getItem('pending-unload-save')){
    localStorage.removeItem('pending-unload-save');
    setTimeout(()=> toast('检测到内容尚未保存，已自动为你保存当前日志'), 300);
  }
  loadEditor(currentDate);
  bindEvents();
  renderAll();
}
init();
</script>
